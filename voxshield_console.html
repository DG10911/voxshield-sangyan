/* VoxScore meta-uncertainty (mirrors backend/voxscore.py) — turns detector
   confidences into {synthetic, evidence, distribution, novelty, risk} with an
   ABSTAIN band so ambiguous / disagreeing inputs route to REVIEW, not a class. */
function voxscore(dets){
  const probs=dets.map(d=>d.c/100), n=probs.length;
  const mean=probs.reduce((a,b)=>a+b,0)/n;
  const std=Math.sqrt(probs.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const mx=Math.max(...probs), fused=0.45*mean+0.55*mx;
  const agreement=1-Math.min(1,std/0.5);
  const polarity=probs.reduce((a,b)=>a+Math.abs(b-0.5),0)/n*2;
  const evidence=Math.max(0,Math.min(1,0.45*agreement+0.35*polarity+0.20));   // 3 families
  const ambiguity=1-Math.min(1,Math.abs(fused-0.5)*2);
  const novelty=Math.max(0,Math.min(1,0.55*(1-agreement)+0.45*ambiguity));
  const distribution=Math.max(0,Math.min(1,polarity*agreement));
  const weak=evidence<0.45||novelty>=0.45;
  const risk=(fused>=0.70&&!weak)?'HIGH':(fused<=0.40&&!weak)?'LOW':weak?'REVIEW':'MEDIUM';
  return {synthetic:fused,evidence,distribution,novelty,risk};
}

}

            <div className="text-[11px] text-mut mt-1 leading-relaxed">Detectors disagree or the input looks outside the known distribution (possible zero-day / unseen generator). VoxShield does <b>not</b> force a HUMAN/AI verdict and never auto-blocks — it routes to step-up verification.</div></div>
        : <div className="rounded-lg border border-line bg-panel2 px-4 py-3">
            <div className="text-[11px] text-mut leading-relaxed">Multi-dimensional score — not one number. When evidence is weak or novelty is high, VoxScore <b>abstains to REVIEW</b> instead of guessing. <span className="text-mut2">(evidence/novelty/distribution are agreement-based heuristics, pending open-set validation.)</span></div></div>}

/* ---- P2/P3 evidence brains + family-diverse arbitration (mirrors backend/orchestrate.py).
   In the live product these run real DSP server-side (/api/analyze → "brains"); here they
   are derived from the scenario so the console shows the same multi-family evidence view. */
function brainsFor(sc){
  const v=voxscore(sc.detectors), syn=v.synthetic;                 // 0..1 synthetic prob
  const nb=(sc.codec||'').indexOf('G.711')>=0||(sc.sr||'')==='8 kHz';
  return {
    human_physics: Math.max(0,Math.min(1, 1-syn*0.9)),             // HPCS: physiological plausibility (high=human)
    replay:        Math.max(0,Math.min(1, (nb?0.35:0.15)+v.novelty*0.3)),
    environment:   Math.max(0,Math.min(1, 0.85-v.novelty*0.4)),    // SVCS capture consistency
    reverse_time:  Math.max(0,Math.min(1, syn*0.85+0.05)),         // synthetic-lean (time-arrow)
    temporal_dna:  Math.max(0,Math.min(1, syn*0.7+v.novelty*0.2)), // synthetic-lean (trajectory)
  };
}

  ['human_physics','Human physics (HPCS)','physics','higher = more human'],
  ['reverse_time','Time-arrow asymmetry','physics','higher = synthetic-leaning'],
  ['temporal_dna','Temporal voice DNA','temporal','higher = synthetic-leaning'],
  ['replay','Replay (double-transmission)','replay','higher = replay-leaning'],
  ['environment','Environment consistency','environment','higher = consistent capture'],
];
function EvidenceBrainsPanel({sc}){
  const b=brainsFor(sc), v=voxscore(sc.detectors);
  const dec=v.risk==='HIGH'?'AI':v.risk==='LOW'?'HUMAN':'UNKNOWN', abstain=v.risk==='REVIEW';

      <div className="text-[11px] text-mut leading-relaxed">Family-diverse <b>evidence arbitration</b> — SSL detectors are collapsed to one family so correlated models can't outvote independent physical evidence.</div>
      <div className="text-right ml-4"><div className="text-[9px] text-mut tracking-wider">ARBITER</div>

  </div>;
}

function useTween(target,ms=900,dep){const[v,setV]=useState(target);const r=useRef(target);
  useEffect(()=>{const from=r.current,t0=performance.now();let id;
    const step=t=>{const k=Math.min(1,(t-t0)/ms);const e=1-Math.pow(1-k,3);const nv=from+(target-from)*e;setV(nv);r.current=nv;if(k<1)id=requestAnimationFrame(step);};
    id=requestAnimationFrame(step);return()=>cancelAnimationFrame(id);},[target,dep]);return v;}

/* ---------------- live waveform ---------------- */
function LiveWaveform({sc,active}){
  const ref=useRef(null);
  useEffect(()=>{const cv=ref.current;if(!cv)return;const ctx=cv.getContext('2d');let raf,t=0;
    const col={red:'#f0475b',amber:'#f6a935',ok:'#26d07c'}[sc.threat];
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const resize=()=>{cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;};resize();window.addEventListener('resize',resize);
    const draw=()=>{const W=cv.width,H=cv.height,mid=H/2;ctx.clearRect(0,0,W,H);
      // VAD blocks
      for(let i=0;i<8;i++){const x=(i/8)*W;const on=Math.sin(t*0.05+i)>-0.3;ctx.fillStyle=on?'#38bdf815':'#ffffff05';ctx.fillRect(x,H-8*dpr,(W/8)-2,6*dpr);}
      // layered waveform
      const layers=[[1,0.9,col+'22',6],[1,0.55,col+'55',3],[1,1,col,1.6]];
      layers.forEach(([f,amp,c,lw])=>{ctx.beginPath();ctx.lineWidth=lw*dpr;ctx.strokeStyle=c;
        for(let x=0;x<=W;x+=2*dpr){const p=x/W;
          const env=(0.35+0.65*Math.abs(Math.sin(p*Math.PI*3+t*0.02)));
          const s=Math.sin(p*40+t*0.13*f)+0.5*Math.sin(p*90-t*0.09)+0.3*Math.sin(p*160+t*0.05);
          const noise=(Math.sin(p*400+t)*0.15);
          const y=mid+(s+noise)*amp*sc.energy*env*(H*0.32);
          x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();});
      // 3s analysis window
      const wx=((t*0.6)% (W*1.2))-W*0.1, ww=W*0.34;
      ctx.strokeStyle=col+'66';ctx.setLineDash([4*dpr,4*dpr]);ctx.lineWidth=1*dpr;ctx.strokeRect(wx,6*dpr,ww,H-20*dpr);ctx.setLineDash([]);
      ctx.fillStyle=col+'12';ctx.fillRect(wx,6*dpr,ww,H-20*dpr);
      // scan beam
      const bx=((t*2)%(W+40))-20;const grd=ctx.createLinearGradient(bx-30,0,bx+30,0);
      grd.addColorStop(0,'#38bdf800');grd.addColorStop(0.5,'#7dd3fc99');grd.addColorStop(1,'#38bdf800');
      ctx.fillStyle=grd;ctx.fillRect(bx-30,0,60,H);
      t+=active?1.4:0.5;raf=requestAnimationFrame(draw);};
    draw();return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
  },[sc,active]);
  return <canvas ref={ref} className="w-full h-[150px] block"></canvas>;
}

        className="flex-1 bg-panel2 border border-line rounded-md px-3 py-1.5 text-[12px] text-txt placeholder-mut2 outline-none focus:border-cyan/50"/>
      {['ALL','HIGH','REVIEW','LOW'].map(f=><button key={f} onClick={()=>setRf(f)}
        className={`px-2.5 py-1.5 rounded-md text-[10px] font-medium border ${rf===f?'border-cyan text-cyan bg-cyan/10':'border-line text-mut'}`}>{f}</button>)}
    </div>
    <div className="overflow-x-auto"><table className="w-full text-left">
      <thead><tr className="text-[9.5px] text-mut2 tracking-wider uppercase">
        {['Call ID','Time','Region','Language','Dur','Risk','Voice','Status',''].map(h=><th key={h} className="font-medium px-2.5 py-2">{h}</th>)}</tr></thead>
      <tbody className="font-mono">
        {rows.map(r=>{const c=rc(+r[5]);return <tr key={r[0]} onClick={()=>onOpen(r[8])}
          className="border-t border-line hover:bg-panel2/70 cursor-pointer group">
          <td className="px-2.5 py-2 text-[11.5px] text-cyan">{r[0]}</td>
          <td className="px-2.5 py-2 text-[11px] text-mut tnum">{r[1]}</td>
          <td className="px-2.5 py-2 text-[11.5px] text-txt font-sans">{r[2]}</td>
          <td className="px-2.5 py-2 text-[11.5px] text-mut font-sans">{r[3]}</td>
          <td className="px-2.5 py-2 text-[11px] text-mut tnum">{r[4]}</td>
          <td className="px-2.5 py-2"><span className={`text-${c} font-bold tnum`}>{r[5]}</span></td>
          <td className="px-2.5 py-2"><span className={`text-[10px] text-${c}`}>{r[6]}</span></td>
          <td className="px-2.5 py-2 text-[10px] text-mut">{r[7]}</td>
          <td className="px-2.5 py-2 text-mut2 group-hover:text-cyan text-xs font-sans">open ›</td>
        </tr>;})}
      </tbody></table></div>
  </div>;
}

/* ---------------- audit + health ---------------- */
function Audit({phase}){const ev=[['14:52:08','VOICE_ANALYSIS_STARTED',1],['14:52:10','VAD_SPEECH_DETECTED',2],
  ['14:52:11','SIGNAL_NORMALIZED',3],['14:52:12','ACOUSTIC_ANALYSIS_DONE',4],['14:52:13','NEURAL_DETECTORS_DONE',5],
  ['14:52:14','META_FUSION_COMPLETED',6],['14:52:15','RISK_SCORE_UPDATED',7],['14:52:16','VERDICT_ISSUED',8],['14:52:17','STEP_UP_RECOMMENDED',9]];
  return <div className="space-y-1.5 font-mono">
    {ev.map((e,i)=>{const on=phase>=e[2];return <div key={i} className={`flex items-center gap-2.5 text-[10.5px] ${on?'':'opacity-30'}`}>
      <span className="text-mut2 tnum">{e[0]}</span><span className={`w-1 h-1 rounded-full ${on?'bg-cyan':'bg-line2'}`}/>
      <span className={on?'text-txt':'text-mut'}>{e[1]}</span></div>;})}
  </div>;
}
function Health(){const rows=[['Telephony Gateway',99],['Silero VAD',100],['Feature Engine',98],['GPU Inference',96],['Meta-Fusion',99],['Risk Engine',100]];
  return <div className="grid grid-cols-2 gap-x-4 gap-y-2.5">
    {rows.map(r=><div key={r[0]}><div className="flex justify-between text-[10px]"><span className="text-mut">{r[0]}</span><span className="text-ok font-mono tnum">{r[1]}%</span></div>
      <div className="h-1 rounded-full bg-line mt-1 overflow-hidden"><div className="h-full bg-ok" style={{width:r[1]+'%'}}/></div></div>)}
  </div>;
}
function FeatureBank(){const[o,setO]=useState(false);const g=[['LFCC',20],['CQCC',20],['GROUP DELAY',12],['F0',9],['JITTER',8],['SHIMMER',8],['HF >6kHz',12]];
  return <div><button onClick={()=>setO(!o)} className="w-full flex items-center justify-between">
    <span className="text-[11px] text-mut">89-dimension feature bank</span><span className={`text-mut2 text-xs ${o?'rotate-90':''}`}>›</span></button>
    {o&&<div className="grid grid-cols-2 gap-1.5 mt-3 fade-in">
      {g.map(x=><div key={x[0]} className="flex items-center justify-between rounded-md border border-line bg-panel2 px-2.5 py-1.5">
        <span className="text-[10.5px] text-txt font-mono">{x[0]}</span><span className="text-[10px] text-cyan font-mono">{x[1]}d</span></div>)}
      <div className="col-span-2 text-[9.5px] text-mut2 mt-1">Computed at 16 kHz analysis (8 kHz Nyquist). The &gt;6 kHz band is empty under 8 kHz telephony — its absence flags narrowband.</div>
    </div>}</div>;
}

/* ---------------- simulation controls ---------------- */
const PHASES=['CALL CONNECTED','VOICE ACTIVITY','SIGNAL NORMALIZED','ACOUSTIC ANALYSIS','NEURAL DETECTORS','META-BRAIN FUSION','RISK ENGINE','VERDICT','BANKING RECOMMENDATION'];
function SimBar({phase,running,run,reset}){
  return <div className="flex items-center gap-3">
    <button onClick={running?reset:run} className={`px-4 py-2 rounded-md font-semibold text-[12px] flex items-center gap-2 ${running?'border border-line2 text-mut':'bg-cyan text-ink glow-cyan hover:brightness-110'}`}>
      {running?'◼ RESET':'▶ RUN SIMULATION'}</button>
    <div className="flex-1 flex items-center gap-1 overflow-x-auto">
      {PHASES.map((p,i)=>{const on=phase>i,cur=phase===i+1;return <div key={i}
        className={`flex items-center gap-1.5 px-2 py-1 rounded whitespace-nowrap text-[9.5px] font-mono transition ${cur?'text-cyan bg-cyan/10':on?'text-txt':'text-mut2'}`}>
        <span className={`w-1.5 h-1.5 rounded-full ${cur?'bg-cyan pulse2':on?'bg-cyan':'bg-line2'}`}/>{String(i+1).padStart(2,'0')} {p}</div>;})}
    </div>
  </div>;
}

/* ---------------- command palette ---------------- */
function Palette({open,onClose,go}){const[q,setQ]=useState('');
  const items=[['Live Console','live'],['Incidents & Calls','calls'],['Voice Fraud Intelligence','intel'],['Detection Analytics','analytics'],['Model Control Center','models'],['Audit Trail','audit']];
  const f=items.filter(i=>i[0].toLowerCase().includes(q.toLowerCase()));
  useEffect(()=>{if(open)setQ('');},[open]);if(!open)return null;
  return <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center pt-[16vh]" onClick={onClose}>
    <div className="w-[520px] bg-panel border border-line2 rounded-xl overflow-hidden glow-cyan" onClick={e=>e.stopPropagation()}>
      <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Search calls, incidents, models, analytics…"
        className="w-full bg-transparent px-4 py-3.5 text-[13px] text-txt outline-none border-b border-line placeholder-mut2"/>
      <div className="p-2">{f.map(i=><button key={i[1]} onClick={()=>{go(i[1]);onClose();}}
        className="w-full text-left px-3 py-2.5 rounded-lg text-[12.5px] text-txt hover:bg-panel2 flex items-center gap-2">
        <span className="text-cyan">›</span>{i[0]}</button>)}</div>
    </div></div>;
}

/* ---------------- generic secondary views ---------------- */
function Bars({data,color='#38bdf8',h=120}){const mx=Math.max(...data);return <svg viewBox={`0 0 300 ${h}`} className="w-full">
  {data.map((d,i)=>{const bh=(d/mx)*(h-20);return <rect key={i} x={i*(300/data.length)+2} y={h-bh} width={300/data.length-4} height={bh} rx="2" fill={color} opacity={0.5+0.5*d/mx}/>;})}</svg>;}
function Analytics(){return <div className="grid md:grid-cols-3 gap-4">
  {[['Calls analyzed','48,210'],['Synthetic detection rate','3.9%'],['False-positive rate','6.3%'],['Avg detection latency','92 ms'],['Model agreement','0.91'],['Language recall (Indic)','82%']].map(m=>
    <Panel key={m[0]} title={m[0]}><div className="font-mono text-2xl font-bold text-txt tnum">{m[1]}</div></Panel>)}
  <Panel title="Detection volume · 7D" className="md:col-span-2"><Bars data={[120,140,132,168,150,188,210]}/></Panel>
  <Panel title="Risk distribution"><Bars data={[210,60,34,18]} color="#f0475b"/></Panel>
</div>;}
function Intel(){const cities=[['Delhi',72,'28%','20%'],['Mumbai',58,'46%','58%'],['Bengaluru',30,'70%','78%'],['Chennai',64,'62%','40%'],['Kolkata',48,'82%','66%'],['Hyderabad',36,'52%','86%']];
  return <div className="grid md:grid-cols-3 gap-4">
    <Panel title="Voice fraud intelligence · India" className="md:col-span-2">
      <div className="relative h-[300px] rounded-lg border border-line bg-[#0a0d13] overflow-hidden grid-bg">
        {cities.map(c=><div key={c[0]} className="absolute" style={{left:c[2],top:c[3]}}>
          <span className="relative flex"><span className="absolute w-8 h-8 -translate-x-1/2 -translate-y-1/2 rounded-full bg-threat/20 pulse2"/>
          <span className="w-2 h-2 rounded-full bg-threat -translate-x-1/2 -translate-y-1/2"/>
          <span className="absolute left-3 -top-2 text-[10px] text-txt whitespace-nowrap">{c[0]} <span className="text-threat font-mono">{c[1]}</span></span></span></div>)}
      </div></Panel>
    <div className="space-y-4">{[['AI voice attacks (24h)','1,204','+38%'],['Repeat callers','86','+12%'],['High-risk regions','4','—'],['Synthetic attempts','512','+61%']].map(m=>
      <Panel key={m[0]} title={m[0]}><div className="flex items-end justify-between"><span className="font-mono text-2xl font-bold text-txt tnum">{m[1]}</span><span className="text-[11px] text-threat font-mono">{m[2]}</span></div></Panel>)}</div>
  </div>;}
function Models(){const stack=[['Acoustic DSP','v3.2','ACTIVE',41],['wav2vec2','v2.1','ACTIVE',128],['XLS-R 300M','v1.7','ACTIVE',151],['DistilHuBERT','v1.4','ACTIVE',97],['LFCC + CQCC','v2.0','ACTIVE',33]];
  const meta=[['MAIN','v4.1','ACTIVE'],['INDIC','v2.3','ACTIVE'],['NARROWBAND','v1.9','DEGRADED']];
  const sc={ACTIVE:'ok',DEGRADED:'amber',STALE:'mut',OFFLINE:'threat'};
  return <div className="grid md:grid-cols-2 gap-4">
    <Panel title="Model stack">{stack.map(m=><div key={m[0]} className="flex items-center justify-between py-2 border-b border-line last:border-0">
      <div><div className="text-[12.5px] text-txt">{m[0]}</div><div className="text-[10px] text-mut2 font-mono">{m[1]} · {m[3]}ms</div></div>
      <span className={`text-[10px] font-mono text-${sc[m[2]]}`}>● {m[2]}</span></div>)}</Panel>
    <Panel title="Meta models">{meta.map(m=><div key={m[0]} className="flex items-center justify-between py-2 border-b border-line last:border-0">
      <div><div className="text-[12.5px] text-txt">{m[0]}</div><div className="text-[10px] text-mut2 font-mono">{m[1]}</div></div>
      <span className={`text-[10px] font-mono text-${sc[m[2]]}`}>● {m[2]}</span></div>)}<div className="mt-3"><FeatureBank/></div></Panel>
  </div>;}

/* ---------------- main app ---------------- */
function App(){
  const [scKey,setScKey]=useState('highrisk');
  const [phase,setPhase]=useState(9);        // 0..9 ; 9 = fully revealed
  const [running,setRunning]=useState(false);
  const [view,setView]=useState('live');
  const [pal,setPal]=useState(false);
  const timers=useRef([]);
  const sc=SCEN[scKey];
  const revealed = phase>=9?9:Math.max(0,phase-4>0?Math.min(5,phase-4+ (phase>=5?1:0)) :0); // detectors reveal during NEURAL phase
  // simpler: detectors count = clamp(phase-4,0,5); risk shows at phase>=7; fusion at phase>=5
  const detCount = phase>=9?5:Math.max(0,Math.min(5,phase-4));
  const reveal = phase>=9?9:phase;

  const clear=()=>{timers.current.forEach(clearTimeout);timers.current=[];};
  const run=useCallback(()=>{clear();setRunning(true);setPhase(0);
    let p=0;const tick=()=>{p++;setPhase(p);if(p<9)timers.current.push(setTimeout(tick,p===5?260:900));};
    // detector reveal sub-steps happen within phase 5 by mapping phase→detCount below
    timers.current.push(setTimeout(tick,500));
  },[]);
  const reset=()=>{clear();setRunning(false);setPhase(9);};
  useEffect(()=>()=>clear(),[]);
  useEffect(()=>{reset();},[scKey]);
  useEffect(()=>{const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setPal(v=>!v);}
    if(e.key==='Escape')setPal(false);};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[]);

  // during sim, detectors reveal progressively across phase 4→5
  const detReveal = running? (phase<4?0:phase===4?2:phase===5?5:5) : 5;
  const fusionReveal = running? (phase>=6?5:0) : 5;
  const riskPhase = running? (phase>=7?7:0) : 7;
  const brainRevealed = running?detReveal:5;
  const riskRevealed = running?(phase>=7?7:0):7;

  const c=tw[sc.threat];
  const NAV=[['live','Live Console','◉'],['calls','Incidents','▤'],['intel','Intelligence','◍'],['analytics','Analytics','▦'],['models','Models','⬡'],['audit','Audit','≣']];

  return <div className="min-h-screen grid-bg">
   <div className="min-h-screen bg-gradient-to-b from-ink/40 via-ink/70 to-ink flex">
    {/* sidebar */}
    <aside className="w-[62px] hover:w-[210px] transition-all duration-200 border-r border-line bg-panel/70 backdrop-blur flex flex-col group overflow-hidden shrink-0">
      <div className="h-14 flex items-center gap-2.5 px-4 border-b border-line">
        <div className="w-7 h-7 rounded-md bg-gradient-to-br from-cyan to-blue grid place-items-center text-ink font-bold shrink-0">V</div>
        <span className="font-semibold tracking-tight opacity-0 group-hover:opacity-100 transition whitespace-nowrap">VoxShield</span></div>
      <nav className="flex-1 py-3">{NAV.map(n=><button key={n[0]} onClick={()=>setView(n[0])}
        className={`w-full flex items-center gap-3 px-[19px] py-2.5 text-[13px] ${view===n[0]?'text-cyan':'text-mut hover:text-txt'}`}>
        <span className={`text-base ${view===n[0]?'':'opacity-70'}`}>{n[2]}</span>
        <span className="opacity-0 group-hover:opacity-100 transition whitespace-nowrap">{n[1]}</span>
        {view===n[0]&&<span className="ml-auto w-1 h-4 rounded bg-cyan opacity-0 group-hover:opacity-100"/>}</button>)}</nav>
      <div className="p-3 border-t border-line"><Dot c="ok" s="secure"/></div>
    </aside>

    {/* main column */}
    <div className="flex-1 min-w-0 flex flex-col">
      {/* top bar */}
      <header className="h-14 border-b border-line bg-panel/60 backdrop-blur flex items-center gap-4 px-5 shrink-0">
        <div className="flex items-center gap-2">
          <h1 className="text-[13px] font-semibold tracking-[0.16em]">VOXSHIELD</h1>
          <span className="text-[10px] text-mut2 hidden md:inline">Real-Time AI Voice-Clone Detection for Banking</span></div>
        <div className="hidden lg:flex items-center gap-4 ml-2"><Dot c="ok" s="Engine online"/><Dot c="cyan" s="Telephony gateway connected"/></div>
        <div className="flex-1"/>
        <div className="hidden md:flex items-center gap-1 mr-1">
          <span className="text-[9px] text-mut2 tracking-widest mr-1">DEMO</span>
          {ORDER.map(k=><button key={k} onClick={()=>setScKey(k)}
            className={`px-2 py-1 rounded text-[9.5px] font-medium border transition ${scKey===k?`border-${THC[SCEN[k].threat]} text-${THC[SCEN[k].threat]} bg-${THC[SCEN[k].threat]}/10`:'border-line text-mut hover:text-txt'}`}>{SCEN[k].tag}</button>)}
        </div>
        <button onClick={()=>setPal(true)} className="flex items-center gap-2 px-2.5 py-1.5 rounded-md border border-line text-mut hover:text-txt text-[11px]">
          <span>⌘K</span></button>
      </header>

      <main className="flex-1 overflow-y-auto p-5">
       {view==='live'&&<div className="max-w-[1500px] mx-auto space-y-4 fade-in">
        {/* simulation bar */}
        <div className="bg-panel/70 border border-line rounded-[10px] px-4 py-3"><SimBar phase={phase} running={running} run={run} reset={reset}/></div>

        {/* row 1: live call + risk */}
        <div className="grid lg:grid-cols-3 gap-4">
          <Panel className="lg:col-span-2" accent={c.g} title={<span className="flex items-center gap-2"><span className={`w-1.5 h-1.5 rounded-full ${c.b} pulse2`}/>LIVE VOICE SECURITY</span>}
            right={<div className="flex items-center gap-3 text-[10px] font-mono text-mut">
              <span className="text-txt">{sc.phone}</span><span>{sc.region}</span><span className="text-cyan">{sc.lang}</span>
              <span className="px-1.5 py-0.5 rounded bg-panel2 border border-line">{sc.codec}</span><span>{sc.sr}</span></div>}>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-4 text-[10px] font-mono text-mut">
                <span>STREAMING AUDIO</span><span className="text-cyan">3.0s WINDOW</span><span className="text-cyan">1.0s HOP</span><span>16 kHz NORMALIZED</span></div>
              <Duration running={running||view==='live'}/>
            </div>
            <div className="rounded-lg border border-line bg-[#080a0f] overflow-hidden"><LiveWaveform sc={sc} active={running}/></div>
          </Panel>
          <Panel title="Risk engine" accent={c.g}><RiskRadial sc={sc} revealed={riskRevealed}/></Panel>
        </div>

        {/* row 2: meta-brain + explain */}
        <div className="grid lg:grid-cols-3 gap-4">
          <Panel className="lg:col-span-2" title={<span className="flex items-center gap-2"><span className="text-cyan">◆</span>VOXSHIELD META-BRAIN · 5-DETECTOR ENSEMBLE</span>}
            right={<span className="text-[10px] font-mono text-mut">learned meta-stacker</span>}>
            <MetaBrain sc={sc} revealed={brainRevealed}/></Panel>
          <Panel title="Why VoxShield flagged this call"><Explain sc={sc}/></Panel>
        </div>

        {/* row 2b: VoxScore meta-uncertainty + open-set abstain */}
        <Panel accent={voxscore(sc.detectors).risk==='REVIEW'?'glow-amber':undefined}
          title={<span className="flex items-center gap-2"><span className="text-cyan">◈</span>VOXSCORE · META-UNCERTAINTY &amp; OPEN-SET</span>}
          right={<span className="text-[10px] font-mono text-mut">abstains when unsure — never auto-blocks</span>}>
          <VoxScorePanel sc={sc}/></Panel>

        {/* row 2c: P2/P3 evidence brains + family-diverse arbitration */}
        <Panel title={<span className="flex items-center gap-2"><span className="text-cyan">❖</span>EVIDENCE BRAINS · PHYSICS · REPLAY · ENVIRONMENT · TIME-ARROW · TRAJECTORY</span>}
          right={<span className="text-[10px] font-mono text-mut">family-diverse arbitration · never standalone</span>}>
          <EvidenceBrainsPanel sc={sc}/></Panel>

        {/* row 2c-2: Bhashini §27 — ALD language routing + ASR transcript (live API) */}
        <Panel title={<span className="flex items-center gap-2"><span className="text-cyan">◉</span>BHASHINI · INDIC LANGUAGE &amp; TRANSCRIPT</span>}
          right={<span className="text-[10px] font-mono text-mut">ALD + ASR via ULCA / Dhruva · advisory evidence</span>}>
          <BhashiniPanel sc={sc}/></Panel>

        {/* row 2d: P3 intelligence layer — threat registry + generator intelligence graph */}
        <Panel title={<span className="flex items-center gap-2"><span className="text-cyan">◎</span>GENERATOR INTELLIGENCE · THREAT REGISTRY &amp; GRAPH</span>}
          right={<span className="text-[10px] font-mono text-mut">measured on DGX · 37,493 clips</span>}>
          <IntelPanel/></Panel>

        {/* row 2e: India-First language mastery scorecard (live from languages.json) */}
        <Panel title={<span className="flex items-center gap-2"><span className="text-cyan">🇮🇳</span>INDIA-FIRST · LANGUAGE MASTERY SCORECARD</span>}
          right={<span className="text-[10px] font-mono text-mut">22 Eighth-Schedule + English · mastery earned per GPU run</span>}>
          <LanguageMasteryPanel/></Panel>

        {/* row 3: telephony pipeline */}
        <Panel title="Telephony signal pipeline" right={<span className="text-[10px] font-mono text-mut">click a stage · {sc.codec} → meta-fusion</span>}>
          <Pipeline phase={running?phase:9}/></Panel>

        {/* row 4: router+indic + banking */}
        <div className="grid lg:grid-cols-3 gap-4">
          <Panel title="Specialised routing"><Router sc={sc}/></Panel>
          <Panel title="Indic-aware detection"><IndicPanel sc={sc}/></Panel>
          <Panel title="Recommended banking response" accent={c.g}><Banking sc={sc}/></Panel>
        </div>

        {/* row 5: table + right rail */}
        <div className="grid lg:grid-cols-3 gap-4">
          <Panel className="lg:col-span-2" title="Live call monitor"><CallTable onOpen={k=>{setScKey(k);setView('live');}}/></Panel>
          <div className="space-y-4">
            <Panel title="Audit trail"><Audit phase={running?phase:9}/></Panel>
            <Panel title="System health"><Health/></Panel>
          </div>
        </div>
        <p className="text-center text-[10px] text-mut2 pt-1 pb-4">VoxShield · on-premises · explainable · human-in-the-loop — detection is advisory, not automatic blocking.</p>
       </div>}

       {view==='calls'&&<div className="max-w-[1200px] mx-auto fade-in"><Panel title="Incidents & calls"><CallTable onOpen={k=>{setScKey(k);setView('live');}}/></Panel></div>}
       {view==='intel'&&<div className="max-w-[1300px] mx-auto fade-in"><Intel/></div>}
       {view==='analytics'&&<div className="max-w-[1300px] mx-auto fade-in"><Analytics/></div>}
       {view==='models'&&<div className="max-w-[1100px] mx-auto fade-in"><Models/></div>}
       {view==='audit'&&<div className="max-w-[720px] mx-auto fade-in"><Panel title="Audit trail"><Audit phase={9}/></Panel></div>}
      </main>
    </div>
   </div>
   <Palette open={pal} onClose={()=>setPal(false)} go={setView}/>
  </div>;
}
function Duration({running}){const[t,setT]=useState(7.42);useEffect(()=>{if(!running)return;const id=setInterval(()=>setT(v=>v+0.11),110);return()=>clearInterval(id);},[running]);
  const m=String(Math.floor(t/60)).padStart(2,'0'),s=t%60;return <span className="font-mono text-cyan text-[13px] tnum">{m}:{s.toFixed(2).padStart(5,'0')}</span>;}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
